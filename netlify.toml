[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://portfolio-api-h4fj.onrender.com/api"
  VITE_SITE_URL = "https://dzherrom.netlify.app"

# Archivos estáticos en public/ (imágenes, CV) — Netlify los sirve antes del SPA
[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/cvs/*"
  to = "/cvs/:splat"
  status = 200

# React Router — rutas de la app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# No usar Netlify Functions en este proyecto.
# En el panel de Netlify, deja "Functions directory" vacío (Not set).
