[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router — todas las rutas sirven index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# No usar Netlify Functions en este proyecto.
# En el panel de Netlify, deja "Functions directory" vacío (Not set).
