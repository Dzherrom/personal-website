databases:
  - name: portfolio-db
    plan: free

services:
  - type: web
    name: portfolio-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SERVE_MEDIA
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://dzherrom.netlify.app"
      - key: DJANGO_ADMIN_USERNAME
        value: admin
      - key: DJANGO_ADMIN_EMAIL
        value: admin@example.com
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
